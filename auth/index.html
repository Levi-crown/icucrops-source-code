<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICuCrops Login</title>
    <link rel="stylesheet" href="./login.css?v=20260922c" />
    <link rel="stylesheet" href="/assets/icucrops-ios-interactions.css?v=20260917d" />
    <link rel="stylesheet" href="/raspberry_pi/pi-performance.css?v=20260917d" />
    <script src="/raspberry_pi/pi-runtime.js?v=20260917d"></script>
    <script>
      (function configureRuntime() {
        const hostname = window.location.hostname || "";
        const isLocalHost = hostname === "127.0.0.1" || hostname === "localhost";
        window.ICuCropsRuntimeConfig = {
          apiBase: isLocalHost ? "http://127.0.0.1:8080" : window.location.origin,
          fallbackApiPort: "8080",
        };
      })();
    </script>
    <script src="/assets/auth-session.js?v=20260930d"></script>
    <script>
      (function routeSharedLogin() {
        const auth = window.ICuCropsAuth;
        const currentUrl = new URL(window.location.href);
        const piMode = window.ICuCropsPiRuntime?.isPiMode?.() || window.ICuCropsPiMode === true;
        document.documentElement.classList.toggle("pi-kiosk", piMode);
        const desktopLocked = currentUrl.searchParams.get("desktop") === "1" || piMode;
        const mobileForced = currentUrl.searchParams.get("mobile") === "1";
        const shouldUseMobileShell = window.ICuCropsPiRuntime?.shouldUseMobileShell?.({ mobileForced, desktopLocked })
          ?? ((mobileForced || isMobileBrowserRequest() || (window.matchMedia?.("(max-width: 820px)")?.matches ?? window.innerWidth <= 820)) && !desktopLocked);
        const session = auth?.readSession?.();

        window.ICuCropsLoginConfig = {
          loginTitle: "Login to ICuCrops",
          loginCopy: "Access your farm dashboard and monitoring controls.",
          showForgotPassword: true,
          postLoginPaths: {
            admin: "../administrator/index.html",
            user: "../user/index.html",
          },
        };

        if (session) {
          const savedHash = auth.takePostLoginHash(session.role);
          const appUrl = new URL(
            shouldUseMobileShell
              ? (session.role === "admin"
                ? "../mobile_web/administrator/index.html"
                : "../mobile_web/user/index.html")
              : (session.role === "admin" ? "../administrator/index.html" : "../user/index.html"),
            window.location.href,
          );
          appUrl.search = currentUrl.search;
          appUrl.hash = savedHash;
          window.location.replace(appUrl.toString());
          return;
        }

        if (shouldUseMobileShell) {
          const mobileUrl = new URL("../mobile_web/auth/index.html", window.location.href);
          mobileUrl.search = currentUrl.search;
          mobileUrl.hash = window.location.hash || "";
          window.location.replace(mobileUrl.toString());
          return;
        }

        function isMobileBrowserRequest() {
          const ua = navigator.userAgent || "";
          const platform = navigator.userAgentData?.platform || navigator.platform || "";
          const mobileHint = navigator.userAgentData?.mobile;
          const maxTouchPoints = navigator.maxTouchPoints || 0;

          if (mobileHint === true) {
            return true;
          }

          if (/Android|iPhone|iPad|iPod|Windows Phone|Mobile/i.test(ua)) {
            return true;
          }

          return /Macintosh/i.test(ua) && maxTouchPoints > 1
            || /iPad|iPhone|iPod/i.test(platform);
        }
      })();
    </script>
    <link rel="stylesheet" href="/assets/icucrops-touch-keyboard.css?v=20260923g" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-shell">
        <article class="login-panel">
          <div class="login-panel__brand">
            <div class="login-panel__visual" aria-hidden="true">
              <img
                class="login-panel__logo"
                src="../assets/icucrops-logo-transparent.png"
                alt="ICuCrops Logo"
              />
              <img
                class="login-panel__mascot"
                src="../assets/funny-monkey-omg-transparent.gif"
                decoding="async"
                alt=""
              />
            </div>
            <h1 class="login-panel__title" id="auth-title">Login to ICuCrops</h1>
            <p class="login-panel__copy" id="auth-copy">
              Access your farm dashboard and monitoring controls.
            </p>
          </div>

          <div id="auth-panel-body"></div>
        </article>
      </section>
    </main>

    <script src="/assets/icucrops-slow-activation.js?v=20260917d" defer></script>
    <script src="/assets/icucrops-touch-keyboard.js?v=20260928a" defer></script>
    <script src="./forgot-password.js?v=20260923h" defer></script>
    <script src="./login-init.js?v=20260922c" defer></script>
  </body>
</html>
