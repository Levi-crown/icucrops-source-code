{{NOTICE}}
<form class="login-form login-form--otp" id="forgot-otp-form" novalidate>
  <div class="login-step-card">
    <p class="login-step-card__label">Email</p>
    <p class="login-step-card__value">{{RECOVERY_EMAIL}}</p>
  </div>

  <div class="login-field">
    <span>OTP Code</span>
    <div class="otp-row">
      {{OTP_INPUTS}}
    </div>
  </div>

  <!-- The notice tells people to "request a new code" when one expires, and
       until now there was no way to do it: the only route back was Back,
       which returns to the email step and loses the address already typed. -->
  <div class="login-actions login-actions--resend">
    <button class="login-link" type="button" data-action="resend-otp" {{RESEND_DISABLED}}>
      {{RESEND_LABEL}}
    </button>
  </div>

  <div class="login-actions login-actions--split">
    <button class="login-link" type="button" data-action="back-to-email" {{OTP_DISABLED}}>
      Back
    </button>
    <button class="login-button login-button--inline" type="submit" {{OTP_DISABLED}}>Next</button>
  </div>
</form>
