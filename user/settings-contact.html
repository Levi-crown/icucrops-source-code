<section class="page-stack guide-page">
  <div class="about-panel contact-panel guide-hero">
    <div class="about-panel__header">
      <span class="spot-icon">{{INFO_ICON}}</span>
      <div>
        <h3 class="section-title about-panel__title">Guide</h3>
        <p class="section-copy contact-panel__copy">
          Full user walkthrough for reading the dashboard, checking history, following cultivation, and using your account settings.
        </p>
      </div>
    </div>
    <div class="guide-hero__meta">
      <div class="chip-row">{{GUIDE_CHIPS}}</div>
